
name: Build FLAME CLIENT APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Build FLAME CLIENT APK
    runs-on: ubuntu-latest

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk

    steps:
      - name: Download source code
        uses: actions/checkout@v4

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Find Android SDK tools
        shell: bash
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" \
            -type f -name sdkmanager 2>/dev/null | head -n 1)

          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager not found"
            exit 1
          fi

          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"

      
      - name: Configure preinstalled Android SDK
        shell: bash
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"

          if [ ! -d "/usr/local/lib/android/sdk/platforms" ]; then
            echo "Android SDK platforms directory not found"
            exit 1
          fi

          ls -la /usr/local/lib/android/sdk

      - name: Locate Android project
        shell: bash
        run: |
          PROJECT_DIR=""

          if [ -f "settings.gradle" ] || [ -f "settings.gradle.kts" ]; then
            PROJECT_DIR="$PWD"
          else
            while IFS= read -r file; do
              dir=$(dirname "$file")
              if [ -d "$dir/app" ]; then
                PROJECT_DIR="$PWD/$dir"
                break
              fi
            done < <(find . -type f \
              \( -name settings.gradle -o -name settings.gradle.kts \) \
              -not -path './.git/*')

            if [ -z "$PROJECT_DIR" ]; then
              ZIP_FILE=$(find . -maxdepth 2 -type f -name '*.zip' | head -n 1)

              if [ -n "$ZIP_FILE" ]; then
                mkdir -p extracted
                unzip -oq "$ZIP_FILE" -d extracted

                while IFS= read -r file; do
                  dir=$(dirname "$file")
                  if [ -d "$dir/app" ]; then
                    PROJECT_DIR="$PWD/$dir"
                    break
                  fi
                done < <(find extracted -type f \
                  \( -name settings.gradle -o -name settings.gradle.kts \))
              fi
            fi
          fi

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Android project with app/ and settings.gradle not found"
            find . -maxdepth 3 -type f | head -100
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Android project: $PROJECT_DIR"

      - name: Install Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle --no-daemon -p "$PROJECT_DIR" assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FLAME_CLIENT-debug-apk
          path: '**/build/outputs/apk/debug/*.apk'
          if-no-files-found: error
          retention-days: 7
